buildscript {
    ext.kotlin_version = '2.4.21'
    ext.spek_version = '2.0.19'
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

plugins {
    id 'pl.allegro.tech.build.axion-release' version '1.21.5'
    id 'com.diffplug.spotless' version '8.12.0'
}

apply plugin: 'kotlin'
apply plugin: 'jacoco'

kotlin {
    compilerOptions {
        allWarningsAsErrors.set(true)
    }
}

spotless {
    kotlin {
        target 'src/**/*.kt'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

project.version = scmVersion.version
group='com.github.unhappychoice'

scmVersion {
    tag {
        prefix = ''
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencyLocking {
    lockAllConfigurations()
}

configurations.implementation {
    // The unified Kotlin standard library already contains these JDK extensions.
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    def okhttpVersion = '5.5.1'

    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "com.squareup.okhttp3:okhttp-jvm:$okhttpVersion"
    // Keep Retrofit's OkHttp 4 JAR off Maven consumers' classpaths.
    implementation('com.squareup.retrofit2:retrofit:3.0.0') {
        exclude group: 'com.squareup.okhttp3', module: 'okhttp'
    }
    implementation('com.squareup.retrofit2:adapter-rxjava3:3.0.0') {
        exclude group: 'com.squareup.okhttp3', module: 'okhttp'
    }
    implementation('com.squareup.retrofit2:converter-gson:3.0.0') {
        exclude group: 'com.squareup.okhttp3', module: 'okhttp'
    }
    implementation 'commons-codec:commons-codec:1.23.0'
    implementation 'io.reactivex.rxjava3:rxjava:3.1.12'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-rx3:1.11.0'
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.3'
    testImplementation "com.squareup.okhttp3:mockwebserver3:$okhttpVersion"
    testImplementation "com.squareup.okhttp3:okhttp-tls:$okhttpVersion"
    testImplementation "com.winterbe:expekt:0.5.0"
    testImplementation "org.spekframework.spek2:spek-dsl-jvm:$spek_version"

    testRuntimeOnly "org.spekframework.spek2:spek-runner-junit5:$spek_version"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:6.1.3"
}

test {
    useJUnitPlatform {
        includeEngines 'spek2'
    }
}

jacocoTestReport {
    // These interfaces' DefaultImpls classes contain compiler-generated compatibility forwarders.
    classDirectories.setFrom(sourceSets.main.output.classesDirs.asFileTree.matching {
        exclude 'com/github/unhappychoice/circleci/CircleCIAPIClientV2$DefaultImpls.class'
        exclude 'com/github/unhappychoice/circleci/CircleCIAPIClientV3$DefaultImpls.class'
    })
    reports {
        xml {
            required = true
        }
        html {
            required = true
        }
    }
}

jacocoTestCoverageVerification {
    // Keep the same exclusions as jacocoTestReport so the verified coverage matches the reported coverage.
    classDirectories.setFrom(sourceSets.main.output.classesDirs.asFileTree.matching {
        exclude 'com/github/unhappychoice/circleci/CircleCIAPIClientV2$DefaultImpls.class'
        exclude 'com/github/unhappychoice/circleci/CircleCIAPIClientV3$DefaultImpls.class'
    })
    violationRules {
        rule {
            limit {
                // Current line coverage is around 96%; this guards against a regression below that.
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

repositories {
    mavenCentral()
}

sourceSets {
    main.java.srcDirs += 'src/main/kotlin'
    test.java.srcDirs += 'src/test/kotlin'
}
