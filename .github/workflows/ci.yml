name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Reject a distribution with a mismatched checksum
        shell: bash
        run: |
          test_dir=$(mktemp -d)
          trap 'rm -rf "$test_dir"' EXIT
          mkdir -p "$test_dir/gradle"
          cp gradlew "$test_dir/"
          cp -r gradle/wrapper "$test_dir/gradle/"
          printf 'Substituted distribution\n' > "$test_dir/substitute.zip"
          sed -i "s|^distributionUrl=.*|distributionUrl=file:$test_dir/substitute.zip|" \
            "$test_dir/gradle/wrapper/gradle-wrapper.properties"

          if GRADLE_USER_HOME="$test_dir/gradle-home" "$test_dir/gradlew" --version \
            > "$test_dir/wrapper.log" 2>&1; then
            echo "Gradle started with an unexpected distribution"
            exit 1
          fi
          cat "$test_dir/wrapper.log"
          grep -F 'Verification of Gradle distribution failed!' "$test_dir/wrapper.log"

      - name: Build and test
        run: ./gradlew build

      - name: Generate coverage report
        run: ./gradlew jacocoTestReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: false
